<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <defs>
    <!-- Navy gradient for the "A" mountain shape -->
    <linearGradient id="aGrad" x1="0" y1="0" x2="60" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0f2245"/>
    </linearGradient>
    <!-- Red gradient for the road swoosh and "GO" -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <!-- Blue highlight for the A -->
    <linearGradient id="blueShine" x1="20" y1="10" x2="45" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0f2245"/>
    </linearGradient>
  </defs>

  <!-- === Stylized "A" icon with road === -->
  <g transform="translate(5, 5)">
    <!-- Main A shape - left stroke -->
    <path d="M50 8 L8 125 L22 125 L50 38 Z" fill="url(#blueShine)"/>
    <!-- Main A shape - right stroke -->
    <path d="M50 8 L92 125 L78 125 L50 38 Z" fill="url(#aGrad)"/>

    <!-- Road curving through the A -->
    <path d="M30 120 Q45 70 50 55 Q55 70 70 120" fill="#0f2245" stroke="none"/>
    <path d="M36 118 Q47 75 50 62 Q53 75 64 118" fill="#2a2a3a" stroke="none"/>
    <!-- Road center dashes -->
    <line x1="50" y1="72" x2="50" y2="80" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="49" y1="85" x2="51" y2="95" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Location Pin -->
    <g transform="translate(26, 25)">
      <path d="M12 0 C5.4 0 0 5.4 0 12 C0 21 12 32 12 32 C12 32 24 21 24 12 C24 5.4 18.6 0 12 0Z" fill="#e53935"/>
      <circle cx="12" cy="12" r="5" fill="white"/>
    </g>

    <!-- Heartbeat/Pulse Line -->
    <path d="M70 65 L80 65 L84 50 L90 80 L96 55 L100 65 L115 65" 
          stroke="#e53935" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === AMBIGO Text === -->
  <g transform="translate(135, 45)">
    <!-- AMBI in dark navy -->
    <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="64" fill="#0f2245" letter-spacing="3">
      <tspan>AMBI</tspan>
    </text>
    <!-- GO in red -->
    <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="64" fill="#e53935" letter-spacing="3" x="210">
      <tspan>GO</tspan>
    </text>
  </g>
</svg>
